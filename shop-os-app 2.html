<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4EFE3; --surface:#FFFFFF; --surface-2:#FBF8F0;
    --text:#24211C; --text-2:#6B655A; --text-muted:#9A9384;
    --accent:#146B72; --accent-dark:#0E4F54; --accent-bg:#E1F1EF;
    --warn:#B5651D; --warn-bg:#F7E9DA;
    --danger:#A32D2D; --danger-bg:#FBE7E7;
    --border:#E4DFD1; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Tajawal',sans-serif;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column;}
  header.topbar{padding:18px 18px 10px; display:flex; align-items:center; justify-content:space-between;}
  .shop-title{font-size:17px; font-weight:700; margin:0;}
  .shop-sub{font-size:12px; color:var(--text-2); margin:2px 0 0;}
  .avatar{width:38px; height:38px; border-radius:50%; background:var(--accent-bg); color:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;}
  main{flex:1; padding:0 16px 90px; overflow-y:auto;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px;}
  .metric-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .metric{background:var(--surface-2); border-radius:var(--radius); padding:12px 14px;}
  .metric .label{font-size:12px; color:var(--text-2); margin:0 0 4px;}
  .metric .value{font-size:19px; font-weight:700; margin:0;}
  h2.section-title{font-size:14px; font-weight:700; color:var(--text-2); margin:18px 0 8px;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .row .name{font-weight:500; font-size:14px;}
  .row .meta{font-size:12px; color:var(--text-2);}
  .pill{display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px; background:var(--accent-bg); color:var(--accent-dark); font-weight:500;}
  .pill.warn{background:var(--warn-bg); color:var(--warn);}
  .pill.danger{background:var(--danger-bg); color:var(--danger);}
  input, select, textarea{width:100%; font-family:'Tajawal',sans-serif; font-size:14px; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); margin-bottom:8px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--accent);}
  label{font-size:12px; color:var(--text-2); display:block; margin-bottom:4px;}
  button{font-family:'Tajawal',sans-serif; cursor:pointer; border:none; border-radius:10px; font-size:14px; font-weight:500; padding:10px 14px;}
  .btn-primary{background:var(--accent); color:#fff; width:100%;}
  .btn-primary:active{background:var(--accent-dark);}
  .btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn-sm{padding:6px 10px; font-size:12px;}
  .btn-danger-text{background:transparent; color:var(--danger); padding:6px 8px; font-size:12px;}
  .btn-wa{background:#E1F1EF; color:var(--accent-dark);}
  .empty{text-align:center; color:var(--text-muted); font-size:13px; padding:30px 10px;}
  nav.tabbar{position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:8px 4px; max-width:480px; margin:0 auto; width:100%;}
  nav.tabbar button{background:none; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--text-muted); font-size:10px; padding:6px 4px; flex:1;}
  nav.tabbar button.active{color:var(--accent);}
  nav.tabbar svg{width:20px; height:20px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .store-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; text-align:center;}
  .store-card .price{font-weight:700; color:var(--accent-dark); margin:4px 0;}
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .modal{background:var(--surface); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:18px; max-height:85vh; overflow-y:auto;}
  .modal h3{margin:0 0 12px; font-size:15px;}
  .close-x{position:absolute; left:16px; top:14px; background:none; color:var(--text-2); font-size:18px; padding:4px;}
  .chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 220px); min-height:300px;}
  .chat-log{flex:1; overflow-y:auto; padding:6px 0;}
  .msg{max-width:80%; padding:9px 13px; border-radius:14px; margin-bottom:8px; font-size:13.5px; line-height:1.6;}
  .msg.user{background:var(--accent); color:#fff; margin-right:0; margin-left:auto; border-bottom-left-radius:4px;}
  .msg.bot{background:var(--surface-2); border:1px solid var(--border); margin-left:0; margin-right:auto; border-bottom-right-radius:4px;}
  .chat-input-row{display:flex; gap:8px; align-items:flex-end;}
  .chat-input-row textarea{margin-bottom:0; resize:none; height:42px;}
  .chat-input-row button{white-space:nowrap;}
  .onboard-wrap{padding:40px 24px; text-align:center;}
  .onboard-wrap h1{font-size:20px; margin-bottom:6px;}
  .onboard-wrap p{color:var(--text-2); font-size:13px; margin-bottom:24px;}
  .loading-dots span{display:inline-block; width:6px; height:6px; background:var(--text-muted); border-radius:50%; margin:0 2px; animation:blink 1.2s infinite;}
  .loading-dots span:nth-child(2){animation-delay:.2s;} .loading-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2} 40%{opacity:1}}
  .error-text{color:var(--danger); font-size:12px; margin:-4px 0 8px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_KEY = "shopdata";
let state = null;
let activeTab = "dashboard";
let activeModal = null;
let chatHistory = [];
let chatBusy = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function defaultState(){
  return { shop: null, products: [], customers: [], sales: [], debts: [] };
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    state = res && res.value ? JSON.parse(res.value) : defaultState();
  }catch(e){
    state = defaultState();
  }
  render();
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error("save failed", e);
  }
}

function fmtMoney(n){
  return Number(n||0).toLocaleString('ar-EG') + " ج.م";
}

function todayKey(d){ return new Date(d).toISOString().slice(0,10); }

// ---------- RENDER ROOT ----------
function render(){
  const app = document.getElementById('app');
  if(!state.shop){
    app.innerHTML = renderOnboarding();
    bindOnboarding();
    return;
  }
  app.innerHTML = `
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="avatar">${(state.shop.owner||'م').trim().slice(0,1)}</div>
        <div>
          <p class="shop-title">${escapeHtml(state.shop.name)}</p>
          <p class="shop-sub">${escapeHtml(state.shop.owner)}</p>
        </div>
      </div>
    </header>
    <main id="main"></main>
    <nav class="tabbar" id="tabbar"></nav>
  `;
  renderTabbar();
  renderMain();
  if(activeModal) renderModal();
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- ONBOARDING ----------
function renderOnboarding(){
  return `
  <div class="onboard-wrap">
    <div class="avatar" style="margin:0 auto 16px; width:52px; height:52px; font-size:20px;">S</div>
    <h1>يلا نبدأ محلك على Shop OS</h1>
    <p>سجّل بيانات محلك عشان نجهزلك المخزون والمبيعات والعملاء والمساعد الذكي أوتوماتيك.</p>
    <div style="text-align:right;">
      <label>اسم المحل</label>
      <input id="ob-shop" placeholder="بقالة الأمين">
      <div id="ob-shop-err" class="error-text" style="display:none;">اكتب اسم المحل الأول</div>
      <label>اسمك</label>
      <input id="ob-owner" placeholder="محمود أحمد">
      <div id="ob-owner-err" class="error-text" style="display:none;">اكتب اسمك</div>
    </div>
    <button class="btn-primary" id="ob-submit" style="margin-top:8px;">ابدأ دلوقتي</button>
  </div>`;
}

function bindOnboarding(){
  document.getElementById('ob-submit').onclick = () => {
    const shopName = document.getElementById('ob-shop').value.trim();
    const ownerName = document.getElementById('ob-owner').value.trim();
    let ok = true;
    document.getElementById('ob-shop-err').style.display = shopName ? 'none' : 'block';
    document.getElementById('ob-owner-err').style.display = ownerName ? 'none' : 'block';
    if(!shopName || !ownerName) return;
    state.shop = { name: shopName, owner: ownerName };
    saveState();
    render();
  };
}

// ---------- TABBAR ----------
const TABS = [
  { id:'dashboard', label:'الرئيسية', icon:'M4 12l8-8 8 8M6 10v9a1 1 0 001 1h3v-6h4v6h3a1 1 0 001-1v-9' },
  { id:'inventory', label:'المخزون', icon:'M3 7l9-4 9 4-9 4-9-4zm0 0v10l9 4 9-4V7' },
  { id:'sales', label:'المبيعات', icon:'M4 4h16v4H4zM4 8l1 12h14l1-12M9 12h6' },
  { id:'customers', label:'العملاء', icon:'M12 12a4 4 0 100-8 4 4 0 000 8zm-7 8a7 7 0 0114 0' },
  { id:'debts', label:'الديون', icon:'M4 4h16v16H4zM8 9h8M8 13h5' },
  { id:'store', label:'المتجر', icon:'M3 9l1-5h16l1 5M4 9v10h16V9M4 9h16M9 13a2 2 0 004 0' },
  { id:'assistant', label:'المساعد', icon:'M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z' }
];

function renderTabbar(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = TABS.map(t => `
    <button class="${activeTab===t.id?'active':''}" data-tab="${t.id}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${t.icon}"/></svg>
      ${t.label}
    </button>`).join('');
  bar.querySelectorAll('button').forEach(b => b.onclick = () => { activeTab = b.dataset.tab; render(); });
}

// ---------- MAIN ROUTER ----------
function renderMain(){
  const main = document.getElementById('main');
  if(activeTab==='dashboard') main.innerHTML = renderDashboard();
  else if(activeTab==='inventory'){ main.innerHTML = renderInventory(); bindInventory(); }
  else if(activeTab==='sales'){ main.innerHTML = renderSales(); bindSales(); }
  else if(activeTab==='customers'){ main.innerHTML = renderCustomers(); bindCustomers(); }
  else if(activeTab==='debts'){ main.innerHTML = renderDebts(); bindDebts(); }
  else if(activeTab==='store') main.innerHTML = renderStore();
  else if(activeTab==='assistant'){ main.innerHTML = renderAssistant(); bindAssistant(); }
  if(activeTab==='dashboard') bindDashboard();
}

// ---------- DASHBOARD ----------
function renderDashboard(){
  const today = todayKey(Date.now());
  const todaySales = state.sales.filter(s => todayKey(s.date)===today);
  const todayTotal = todaySales.reduce((a,s)=>a+s.total,0);
  const totalDebt = state.debts.filter(d=>!d.paid).reduce((a,d)=>a+d.amount,0);
  const lowStock = state.products.filter(p=>p.qty<=3);
  return `
    <div class="metric-row">
      <div class="metric"><p class="label">مبيعات اليوم</p><p class="value">${fmtMoney(todayTotal)}</p></div>
      <div class="metric"><p class="label">ديون مستحقة</p><p class="value">${fmtMoney(totalDebt)}</p></div>
      <div class="metric"><p class="label">عدد الأصناف</p><p class="value">${state.products.length}</p></div>
      <div class="metric"><p class="label">عدد العملاء</p><p class="value">${state.customers.length}</p></div>
    </div>
    <h2 class="section-title">أصناف قربت تخلص</h2>
    <div class="card">
      ${lowStock.length ? lowStock.map(p=>`<div class="row"><span class="name">${escapeHtml(p.name)}</span><span class="pill warn">متبقي ${p.qty}</span></div>`).join('') : '<div class="empty">مفيش أصناف قربت تخلص</div>'}
    </div>
    <h2 class="section-title">آخر مبيعات</h2>
    <div class="card">
      ${state.sales.slice(-5).reverse().map(s=>`<div class="row"><span class="name">${escapeHtml(s.productName)} × ${s.qty}</span><span class="meta">${fmtMoney(s.total)}</span></div>`).join('') || '<div class="empty">لسه مفيش مبيعات مسجلة</div>'}
    </div>
    <button class="btn-ghost" id="dash-assistant" style="width:100%; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:4px;">
      اسأل المساعد الذكي عن محلك
    </button>
  `;
}
function bindDashboard(){
  const b = document.getElementById('dash-assistant');
  if(b) b.onclick = () => { activeTab='assistant'; render(); };
}

// ---------- INVENTORY ----------
function renderInventory(){
  return `
    <h2 class="section-title">إضافة صنف جديد</h2>
    <div class="card">
      <label>اسم الصنف</label>
      <input id="inv-name" placeholder="زيت عافية 1 لتر">
      <div class="grid-2">
        <div>
          <label>السعر (ج.م)</label>
          <input id="inv-price" type="number" min="0" placeholder="55">
        </div>
        <div>
          <label>الكمية</label>
          <input id="inv-qty" type="number" min="0" placeholder="20">
        </div>
      </div>
      <div id="inv-err" class="error-text" style="display:none;"></div>
      <button class="btn-primary" id="inv-add">إضافة الصنف</button>
    </div>
    <h2 class="section-title">الأصناف (${state.products.length})</h2>
    <div class="card">
      ${state.products.length ? state.products.map(p => `
        <div class="row">
          <div>
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="meta">${fmtMoney(p.price)} · متبقي ${p.qty}</div>
          </div>
          <button class="btn-danger-text" data-del="${p.id}">حذف</button>
        </div>`).join('') : '<div class="empty">أضف أول صنف في محلك</div>'}
    </div>
  `;
}
function bindInventory(){
  document.getElementById('inv-add').onclick = () => {
    const name = document.getElementById('inv-name').value.trim();
    const price = parseFloat(document.getElementById('inv-price').value);
    const qty = parseInt(document.getElementById('inv-qty').value);
    const err = document.getElementById('inv-err');
    if(!name || isNaN(price) || price<0 || isNaN(qty) || qty<0){
      err.textContent = 'اكتب اسم الصنف وسعر وكمية صحيحين';
      err.style.display='block';
      return;
    }
    state.products.push({ id: uid(), name, price, qty });
    saveState();
    render();
  };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    state.products = state.products.filter(p=>p.id!==b.dataset.del);
    saveState(); render();
  });
}

// ---------- SALES ----------
function renderSales(){
  const custOptions = `<option value="">زبون عابر</option>` + state.customers.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  const prodOptions = state.products.map(p=>`<option value="${p.id}">${escapeHtml(p.name)} — ${fmtMoney(p.price)}</option>`).join('');
  return `
    <h2 class="section-title">تسجيل عملية بيع</h2>
    <div class="card">
      ${state.products.length ? `
      <label>الصنف</label>
      <select id="sale-prod">${prodOptions}</select>
      <div class="grid-2">
        <div>
          <label>الكمية</label>
          <input id="sale-qty" type="number" min="1" value="1">
        </div>
        <div>
          <label>الزبون</label>
          <select id="sale-cust">${custOptions}</select>
        </div>
      </div>
      <label>طريقة الدفع</label>
      <select id="sale-pay">
        <option value="cash">كاش</option>
        <option value="credit">آجل (على الحساب)</option>
      </select>
      <div id="sale-err" class="error-text" style="display:none;"></div>
      <button class="btn-primary" id="sale-add">تسجيل البيع</button>
      ` : `<div class="empty">أضف أصناف في المخزون الأول</div>`}
    </div>
    <h2 class="section-title">سجل المبيعات</h2>
    <div class="card">
      ${state.sales.slice().reverse().map(s => `
        <div class="row">
          <div>
            <div class="name">${escapeHtml(s.productName)} × ${s.qty}</div>
            <div class="meta">${escapeHtml(s.customerName||'زبون عابر')} · ${s.pay==='credit'?'آجل':'كاش'}</div>
          </div>
          <span class="meta">${fmtMoney(s.total)}</span>
        </div>`).join('') || '<div class="empty">لسه مفيش مبيعات</div>'}
    </div>
  `;
}
function bindSales(){
  const addBtn = document.getElementById('sale-add');
  if(!addBtn) return;
  addBtn.onclick = () => {
    const prodId = document.getElementById('sale-prod').value;
    const qty = parseInt(document.getElementById('sale-qty').value);
    const custId = document.getElementById('sale-cust').value;
    const pay = document.getElementById('sale-pay').value;
    const err = document.getElementById('sale-err');
    const product = state.products.find(p=>p.id===prodId);
    if(!product || isNaN(qty) || qty<1){ err.textContent='اختار صنف وكمية صحيحة'; err.style.display='block'; return; }
    if(qty > product.qty){ err.textContent='الكمية المتاحة أقل من كده'; err.style.display='block'; return; }
    if(pay==='credit' && !custId){ err.textContent='لازم تحدد الزبون للبيع الآجل'; err.style.display='block'; return; }
    const customer = state.customers.find(c=>c.id===custId);
    const total = product.price * qty;
    product.qty -= qty;
    state.sales.push({ id: uid(), productId: product.id, productName: product.name, qty, total, date: Date.now(), customerId: custId||null, customerName: customer?customer.name:null, pay });
    if(pay==='credit'){
      state.debts.push({ id: uid(), customerId: custId, customerName: customer.name, amount: total, note: `${product.name} × ${qty}`, date: Date.now(), paid: false });
    }
    saveState();
    render();
  };
}

// ---------- CUSTOMERS ----------
function renderCustomers(){
  return `
    <h2 class="section-title">إضافة عميل</h2>
    <div class="card">
      <label>اسم العميل</label>
      <input id="cust-name" placeholder="أحمد سعيد">
      <label>رقم الموبايل</label>
      <input id="cust-phone" placeholder="01012345678">
      <div id="cust-err" class="error-text" style="display:none;"></div>
      <button class="btn-primary" id="cust-add">إضافة العميل</button>
    </div>
    <h2 class="section-title">العملاء (${state.customers.length})</h2>
    <div class="card">
      ${state.customers.length ? state.customers.map(c => {
        const debt = state.debts.filter(d=>d.customerId===c.id && !d.paid).reduce((a,d)=>a+d.amount,0);
        return `
        <div class="row">
          <div>
            <div class="name">${escapeHtml(c.name)}</div>
            <div class="meta">${escapeHtml(c.phone||'بدون رقم')}${debt>0?' · عليه '+fmtMoney(debt):''}</div>
          </div>
          <div style="display:flex; gap:6px;">
            ${c.phone ? `<button class="btn-wa btn-sm" data-wa="${c.id}">واتساب</button>` : ''}
            <button class="btn-danger-text" data-delcust="${c.id}">حذف</button>
          </div>
        </div>`;
      }).join('') : '<div class="empty">لسه مفيش عملاء متسجلين</div>'}
    </div>
  `;
}
function bindCustomers(){
  document.getElementById('cust-add').onclick = () => {
    const name = document.getElementById('cust-name').value.trim();
    const phone = document.getElementById('cust-phone').value.trim();
    const err = document.getElementById('cust-err');
    if(!name){ err.textContent='اكتب اسم العميل'; err.style.display='block'; return; }
    state.customers.push({ id: uid(), name, phone });
    saveState(); render();
  };
  document.querySelectorAll('[data-delcust]').forEach(b => b.onclick = () => {
    state.customers = state.customers.filter(c=>c.id!==b.dataset.delcust);
    saveState(); render();
  });
  document.querySelectorAll('[data-wa]').forEach(b => b.onclick = () => {
    const c = state.customers.find(x=>x.id===b.dataset.wa);
    const debt = state.debts.filter(d=>d.customerId===c.id && !d.paid).reduce((a,d)=>a+d.amount,0);
    const msg = debt>0
      ? `تحية طيبة يا ${c.name}، تذكير بمبلغ ${debt} جنيه مستحق من ${escapeHtml(state.shop.name)}.`
      : `تحية طيبة يا ${c.name}، من ${escapeHtml(state.shop.name)}.`;
    const phone = c.phone.replace(/[^0-9]/g,'');
    const intlPhone = phone.startsWith('0') ? '2'+phone : phone;
    window.open(`https://wa.me/${intlPhone}?text=${encodeURIComponent(msg)}`, '_blank');
  });
}

// ---------- DEBTS ----------
function renderDebts(){
  const unpaid = state.debts.filter(d=>!d.paid);
  const total = unpaid.reduce((a,d)=>a+d.amount,0);
  return `
    <div class="metric" style="margin-bottom:14px;">
      <p class="label">إجمالي الديون المستحقة</p>
      <p class="value">${fmtMoney(total)}</p>
    </div>
    <h2 class="section-title">الديون المستحقة</h2>
    <div class="card">
      ${unpaid.length ? unpaid.map(d => `
        <div class="row">
          <div>
            <div class="name">${escapeHtml(d.customerName)}</div>
            <div class="meta">${escapeHtml(d.note)}</div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="pill warn">${fmtMoney(d.amount)}</span>
            <button class="btn-ghost btn-sm" data-paid="${d.id}">اتسدد</button>
          </div>
        </div>`).join('') : '<div class="empty">مفيش ديون مستحقة دلوقتي</div>'}
    </div>
  `;
}
function bindDebts(){
  document.querySelectorAll('[data-paid]').forEach(b => b.onclick = () => {
    const d = state.debts.find(x=>x.id===b.dataset.paid);
    if(d) d.paid = true;
    saveState(); render();
  });
}

// ---------- STORE ----------
function renderStore(){
  return `
    <h2 class="section-title">واجهة المتجر الإلكتروني (زي ما هيشوفها العميل)</h2>
    <div class="grid-2">
      ${state.products.length ? state.products.map(p => `
        <div class="store-card">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="price">${fmtMoney(p.price)}</div>
          <span class="pill ${p.qty>0?'':'danger'}">${p.qty>0?'متوفر':'غير متوفر'}</span>
        </div>`).join('') : `<div class="empty" style="grid-column:1/-1;">أضف أصناف من المخزون عشان تظهر هنا</div>`}
    </div>
  `;
}

// ---------- AI ASSISTANT ----------
function renderAssistant(){
  return `
    <h2 class="section-title">المساعد الذكي لمحلك</h2>
    <div class="chat-wrap">
      <div class="chat-log" id="chat-log">
        ${chatHistory.length ? chatHistory.map(m => `<div class="msg ${m.role}">${escapeHtml(m.text)}</div>`).join('') : `<div class="empty">اسأل مثلاً: "فين المنتج زيت عافية؟" أو "مين عليه فلوس؟"</div>`}
        ${chatBusy ? `<div class="msg bot loading-dots"><span></span><span></span><span></span></div>` : ''}
      </div>
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="اكتب سؤالك هنا..."></textarea>
        <button class="btn-primary" id="chat-send">إرسال</button>
      </div>
    </div>
  `;
}
function bindAssistant(){
  const log = document.getElementById('chat-log');
  if(log) log.scrollTop = log.scrollHeight;
  const send = document.getElementById('chat-send');
  const input = document.getElementById('chat-input');
  if(!send) return;
  send.onclick = async () => {
    const text = input.value.trim();
    if(!text || chatBusy) return;
    chatHistory.push({ role:'user', text });
    input.value = '';
    chatBusy = true;
    renderMain(); bindAssistant();
    try{
      const context = {
        shop: state.shop,
        products: state.products.map(p=>({name:p.name, price:p.price, qty:p.qty})),
        customers: state.customers.map(c=>({name:c.name})),
        debts: state.debts.filter(d=>!d.paid).map(d=>({customer:d.customerName, amount:d.amount, note:d.note}))
      };
      const system = `أنت مساعد ذكي لصاحب محل مصري صغير اسمه "${state.shop.name}". جاوب بالعامية المصرية، بإيجاز ووضوح، بناءً فقط على البيانات دي: ${JSON.stringify(context)}. لو السؤال مش متعلق بالمحل أو البيانات مش كافية، قول كده بصراحة.`;
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system,
          messages: [{ role: "user", content: text }]
        })
      });
      const data = await resp.json();
      const reply = (data.content||[]).map(b=>b.text||'').join('\\n').trim() || 'معلش، حصل خطأ في الرد.';
      chatHistory.push({ role:'bot', text: reply });
    }catch(e){
      chatHistory.push({ role:'bot', text: 'معلش، مش قادر أوصل للمساعد دلوقتي. جرب تاني.' });
    }
    chatBusy = false;
    renderMain(); bindAssistant();
  };
  input.onkeydown = (e) => {
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send.click(); }
  };
}

loadState();
</script>
</body>
</html>
